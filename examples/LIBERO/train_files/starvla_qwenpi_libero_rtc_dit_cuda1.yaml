run_id: qwenpi_libero_object_qwen3vl4b_rtc_dit_delay5_abs_gradacc8_effective_50ep_config
run_root_dir: ./RTC_log/Checkpoints
seed: 42
trackers: [jsonl, wandb]
wandb_entity: local
wandb_project: starVLA_Libero_QwenPI
is_debug: false

framework:
  name: QwenPI
  rtc:
    enable: true
    simulated_delay: 5
    conditioning_mode: dit_token
  qwenvl:
    base_vlm: /diff/wallx_workspace/khl_179/wallx_data_ckp/checkpoints/Qwen/Qwen3-VL-4B-Instruct
    attn_implementation: sdpa
    torch_dtype: bfloat16
    vl_hidden_dim: 2560

  action_model:
    action_model_type: DiT-B
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 7
    state_dim: 8
    future_action_window_size: 7
    action_horizon: 8
    past_action_window_size: 0
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      cross_attention_dim: 2560
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: "ada_norm"
      num_layers: 16
      output_dim: 2560
      positional_embeddings: null

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: playground/Datasets/LEROBOT_LIBERO_DATA
    data_mix: libero_object
    action_type: delta_qpos
    action_mode: abs
    sequential_step_sampling: false
    CoT_prompt: "Your task is {instruction}."
    CoT_answer: bbox
    default_image_resolution: [3, 224, 224]
    image_size: [224, 224]
    per_device_batch_size: 2
    load_all_data_for_training: true
    obs: ["image_0"]
    video_backend: torchvision_av

trainer:
  epochs: 50
  max_train_steps: 0
  enable_tensorboard: true
  num_warmup_steps: 50
  save_interval: 500
  eval_interval: 100
  learning_rate:
    action_model: 1.0e-5
    base: 1.0e-5
    qwen_vl_interface: 1.0e-5
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-6
  freeze_modules: qwen_vl_interface
  loss_scale:
    vla: 1.0
  repeated_diffusion_steps: 4
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 5.0
  gradient_accumulation_steps: 8
  pretrained_checkpoint: null
  reload_modules: null

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 1.0e-8

  save_format: pt
  is_resume: false
  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
