run_id: qwenpi_wallx_subtask_vlm_only
run_root_dir: /diff/wallx_workspace/xch/checkpoint
seed: 42
trackers: [jsonl, wandb]
wandb_entity: yuxuanxu-xyx-beijing-jiaotong-university
wandb_project: qwenpi_wallx_subtask
is_debug: false

framework:
  name: QwenPI
  qwenvl:
    base_vlm: /diff/wallx_workspace/wallx_data_ckp/checkpoints/Qwen/Qwen3-VL-4B-Instruct
    attn_implementation: flash_attention_2
    torch_dtype: bfloat16
    vl_hidden_dim: 2560
  dino:
    dino_backbone: dinov2_vits14

  action_model:
    action_model_type: DiT-B
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 6
    state_dim: 6
    future_action_window_size: 31
    action_horizon: 32
    past_action_window_size: 0
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      cross_attention_dim: 2560
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: "ada_norm"
      num_layers: 16
      output_dim: 2560
      positional_embeddings: null

datasets:
  split:
    enable: true
    train_ratio: 0.9
    mode: contiguous

  subtask_data:
    dataset_py: wallx_subtask_dataset
    repo_id: dzb/lerobot_ego_data_subtask
    root: /diff/wallx_workspace/xch/lerobot_ego_data_subtask
    per_device_batch_size: 4
    num_workers: 4
    image_size: [224, 224]
    action_horizon: 32
    action_in_ego: true
    use_delta_action: false
    normalize_action: true
    normalize_state: true
    truncate_keyframe_value: 2
    include_history_keyframes: true
    max_history_keyframes: 2
    history_keyframe_values: [1]
    snap_rotation_to_start: true
    include_state: false
    max_retry: 64
    video_backend: pyav
    tolerance_s: 0.0001
    photometric_augmentation:
      enabled: false
      probability: 1.0
      brightness: 0.20
      contrast: 0.20
      saturation: 0.20
      hue: 0.02
      sharpness: 0.10
    subtask_prompt_template: "{instruction}\nYou are performing a drone navigation task. The first image is the current front view; any following images are previous keyframes for context.\nCompleted subtasks: {subtask_history}\nWhat subtask should you perform now? Output exactly one subtask."

trainer:
  epochs: 100
  max_train_steps: 15000
  num_warmup_steps: 500
  save_interval: 1000
  eval_interval: 50
  learning_rate:
    action_model: 3.0e-06
    base: 1.0e-05
    qwen_vl_interface: 1.0e-05
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 2.0e-06
  freeze_modules: 'action_model'
  loss_scale:
    vlm: 1.0
    action: 0.0
  repeated_diffusion_steps: 4
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 5.0
  gradient_accumulation_steps: 4
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
  save_format: pt
  is_resume: false
  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
