run_id: qwenpi_wallx_0526_no_rtc_cuda1_cpuoffload_dimloss
run_root_dir: /diff/wallx_workspace/khl_179/starVLA_rtc_dev/RTC_log/Checkpoints
seed: 42
trackers: [jsonl, wandb]
wandb_entity: local
wandb_project: qwenpi_wallx_rtc
is_debug: false

framework:
  name: QwenPI
  rtc:
    enable: false
    simulated_delay: 5
    conditioning_mode: dit_token
  router:
    action_supervision: flow_matching
    action_loss_grad_to_vlm: false
    action_route_format: token
  qwenvl:
    base_vlm: /diff/wallx_workspace/wallx_data_ckp/checkpoints/Qwen/Qwen3-VL-4B-Instruct-ActionRouterSubtask
    attn_implementation: sdpa
    torch_dtype: bfloat16
    vl_hidden_dim: 2560
    num_vl_layers: 36
    freeze: true
    special_tokens:
      policy: strict
      require_fast_action_tokens: true
      action_token_prefix: "<robot_action_"
      action_token_count: 2048
      router_tokens:
        - "<|pred_action|>"
        - "<|pred_bbox|>"
        - "<|subtask|>"
        - "<|end_subtask|>"
  action_tokenizer:
    type: fast
    path: /diff/wallx_workspace/wallx_data_ckp/checkpoints/fast_tokenizers/wallx_ego_h24_v2048
    token_prefix: "<robot_action_"
    token_count: 2048
  dino:
    dino_backbone: dinov2_vits14
  action_model:
    freeze: false
    action_model_type: DiT-B
    action_dim: 6
    state_dim: 6
    future_action_window_size: 23
    action_horizon: 24
    past_action_window_size: 0
    add_pos_embed: true
    max_seq_len: 1024
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      attention_head_dim: 64
      cross_attention_dim: 2560
      dropout: 0.2
      final_dropout: true
      input_embedding_dim: 2560
      interleave_self_attention: true
      norm_type: ada_norm
      num_attention_heads: 40
      num_layers: 36
      output_dim: 2560
      positional_embeddings: null

datasets:
  split:
    enable: true
    train_ratio: 0.9
    mode: contiguous
  sft_multi:
    enable: false
  router_data:
    dataset_py: wallx_router_dataset
    repo_id: dzb/lerobot_ego_0526
    root: /diff/wallx_workspace/khl_179/processed_datasets/lerobot_ego_0526
    per_device_batch_size: 1
    num_workers: 4
    image_size: [224, 224]
    action_horizon: 24
    action_in_ego: true
    use_delta_action: false
    normalize_action: true
    normalize_state: true
    truncate_keyframe_value: 2
    include_history_keyframes: true
    max_history_keyframes: 2
    history_keyframe_values: [1]
    snap_rotation_to_start: true
    include_state: false
    max_retry: 64
    video_backend: pyav
    tolerance_s: 0.0001
    pred_action_token: "<|pred_action|>"
    pred_bbox_token: "<|pred_bbox|>"
    pred_signal_pred_action: "<pred_action>"
    pred_signal_stop: "<stop>"
    action_supervision: flow_matching
    action_route_format: token
    operation_grasp_true: put
    operation_grasp_false: grasp
    bbox_solution_separator: ""
    photometric_augmentation:
      enabled: false

trainer:
  enable_tensorboard: true
  epochs: 100
  max_train_steps: 5000
  num_warmup_steps: 100
  save_interval: 500
  eval_interval: 100
  learning_rate:
    action_model: 1.0e-05
    base: 1.0e-05
    qwen_vl_interface: 1.0e-05
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: qwen_vl_interface
  loss_scale:
    vlm: 0.0
    action: 1.0
  repeated_diffusion_steps: 4
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 5.0
  gradient_accumulation_steps: 8
  skip_no_grad_batches: true
  deepspeed:
    zero_stage: 2
    offload_optimizer_device: cpu
    offload_param_device: none
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
  save_format: pt
  is_resume: false
  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
  pretrained_checkpoint: /diff/wallx_workspace/khl_179/Checkpoints/qwenpi_wallx_flow_from_fast_default_h24_bbox_subtask_new_data_no_detach_action_grad/final_model/pytorch_model.pt
  reload_modules: null
